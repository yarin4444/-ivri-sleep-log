<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>יומן שינה – עברי 👶</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Heebo', sans-serif; background-color: #0b0f19; }
    .glass-card { background: rgba(30, 41, 59, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .animate-fade { animation: fadeIn 0.25s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col pb-12">

  <!-- Header -->
  <header class="bg-slate-900/90 border-b border-slate-800 p-3.5 sticky top-0 z-40 backdrop-blur-md">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-amber-400 flex items-center justify-center text-xl shadow-md">
          🌙
        </div>
        <div>
          <h1 class="text-base font-black text-amber-300">יומן שינה – עברי</h1>
          <p class="text-[10px] text-purple-300/80 font-medium">סנכרון ענני משותף</p>
        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <button onclick="openSyncModal()" class="text-xs bg-indigo-500/15 text-indigo-300 border border-indigo-500/30 px-2.5 py-1.5 rounded-xl font-semibold flex items-center gap-1.5">
          <span id="syncDot" class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <span>🔄 סנכרון</span>
        </button>
        <button onclick="exportCSV()" class="text-xs bg-amber-500/10 text-amber-300 border border-amber-500/30 px-2 py-1.5 rounded-xl font-bold">
          📥 CSV
        </button>
      </div>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <nav class="bg-slate-900/60 border-b border-slate-800 max-w-md mx-auto w-full flex text-xs font-bold">
    <button onclick="switchTab('night')" id="tab-night" class="flex-1 py-3 text-center text-amber-300 border-b-2 border-amber-400">🌙 שנת לילה</button>
    <button onclick="switchTab('day')" id="tab-day" class="flex-1 py-3 text-center text-slate-400 border-b-2 border-transparent">☀️ תנומות יום</button>
    <button onclick="switchTab('charts')" id="tab-charts" class="flex-1 py-3 text-center text-slate-400 border-b-2 border-transparent">📈 גרף שינה</button>
    <button onclick="switchTab('history')" id="tab-history" class="flex-1 py-3 text-center text-slate-400 border-b-2 border-transparent">📜 יומן שינה</button>
  </nav>

  <!-- Main Content Area -->
  <main class="max-w-md mx-auto w-full p-3.5 flex-1 space-y-4">

    <!-- TAB 1: NIGHT VIEW -->
    <section id="view-night" class="space-y-4 animate-fade">
      <div class="glass-card rounded-2xl p-4 space-y-3.5">
        <div class="flex justify-between items-center border-b border-slate-800 pb-2.5">
          <h2 class="font-bold text-amber-300 text-sm">🌙 השכבת לילה ראשונית</h2>
          <input type="date" id="nightDate" onchange="handleNightDateChange()" class="bg-slate-950 border border-slate-700 rounded-xl text-xs px-2.5 py-1 text-slate-200">
        </div>

        <div>
          <label class="text-[11px] text-slate-400 block mb-1">שלב בתהליך</label>
          <div class="grid grid-cols-5 gap-1.5">
            <button onclick="setStage(1)" id="stage-1" class="stage-btn bg-amber-400 text-slate-950 font-bold p-2 rounded-xl text-xs">שלב 1</button>
            <button onclick="setStage(2)" id="stage-2" class="stage-btn bg-slate-800 text-slate-300 font-semibold p-2 rounded-xl text-xs">שלב 2</button>
            <button onclick="setStage(3)" id="stage-3" class="stage-btn bg-slate-800 text-slate-300 font-semibold p-2 rounded-xl text-xs">שלב 3</button>
            <button onclick="setStage(4)" id="stage-4" class="stage-btn bg-slate-800 text-slate-300 font-semibold p-2 rounded-xl text-xs">שלב 4</button>
            <button onclick="setStage(5)" id="stage-5" class="stage-btn bg-slate-800 text-slate-300 font-semibold p-2 rounded-xl text-xs">שלב 5</button>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="text-[11px] text-slate-400 block mb-1">שעת השכבה</label>
            <input type="time" id="nightBedtime" value="19:30" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-center font-mono font-bold text-amber-300">
          </div>
          <div>
            <label class="text-[11px] text-slate-400 block mb-1">זמן עד שנרדם (דקות)</label>
            <input type="number" id="nightTimeToSleep" value="10" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-center font-mono text-slate-100">
          </div>
        </div>

        <div>
          <label class="text-[11px] text-slate-400 block mb-1.5">מי הרדים?</label>
          <div class="grid grid-cols-3 gap-2">
            <button onclick="setNightWho('אבא')" id="who-אבא" class="who-btn bg-amber-400 text-slate-950 font-bold p-2.5 rounded-xl text-xs">אבא</button>
            <button onclick="setNightWho('אמא')" id="who-אמא" class="who-btn bg-slate-800 text-slate-300 font-semibold p-2.5 rounded-xl text-xs">אמא</button>
            <button onclick="setNightWho('עצמאי')" id="who-עצמאי" class="who-btn bg-slate-800 text-slate-300 font-semibold p-2.5 rounded-xl text-xs">עצמאי</button>
          </div>
        </div>

        <div>
          <label class="text-[11px] text-slate-400 block mb-1">אופן הרדמה / הערות</label>
          <textarea id="nightHow" rows="2" placeholder="איך נרדם..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-100 resize-none"></textarea>
        </div>

        <button onclick="saveNightSession()" class="w-full bg-gradient-to-r from-amber-400 to-amber-500 text-slate-950 font-extrabold py-3 rounded-xl text-xs shadow-lg">
          💾 שמור השכבת לילה
        </button>
      </div>

      <!-- Awakenings Logger -->
      <div class="glass-card rounded-2xl p-4 space-y-3.5">
        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
          <h3 class="font-bold text-purple-300 text-xs">🔔 תיעוד יקיצות לילה</h3>
          <span id="wakeNumberDisplay" class="bg-purple-500/20 text-purple-300 font-bold px-2.5 py-0.5 rounded-lg text-xs font-mono">יקיצה 1</span>
        </div>

        <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-xs flex justify-between items-center">
          <span class="text-slate-400">משויך ללילה:</span>
          <select id="wakeTargetNight" onchange="updateWakeNumberBadge()" class="bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-purple-300 text-xs font-semibold"></select>
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="text-[11px] text-slate-400 block mb-1">שעת יקיצה</label>
            <input type="time" id="wakeTime" value="20:30" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs font-mono font-bold text-center text-slate-100">
          </div>
          <div>
            <label class="text-[11px] text-slate-400 block mb-1">זמן ערות (דקות)</label>
            <input type="number" id="wakeTimeToSleep" value="5" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-center font-mono text-slate-100">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="text-[11px] text-slate-400 block mb-1">מי טיפל?</label>
            <select id="wakeWho" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-slate-200">
              <option value="אבא">אבא</option>
              <option value="אמא">אמא</option>
              <option value="עצמאי">עצמאי</option>
            </select>
          </div>
          <div>
            <label class="text-[11px] text-slate-400 block mb-1">איך נרדם בחזרה?</label>
            <input type="text" id="wakeHow" placeholder="מוצץ, מגע..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-slate-100">
          </div>
        </div>

        <button onclick="saveWakeSession()" class="w-full bg-slate-800 text-purple-300 font-bold py-2.5 rounded-xl text-xs border border-purple-500/30">
          ➕ הוסף יקיצה ללילה זה
        </button>
      </div>
    </section>

    <!-- TAB 2: DAY VIEW -->
    <section id="view-day" class="hidden space-y-4 animate-fade">
      <div class="glass-card rounded-2xl p-4 space-y-3.5">
        <h2 class="font-bold text-sky-400 text-sm border-b border-slate-800 pb-2">☀️ תנומת יום</h2>
        <div class="grid grid-cols-2 gap-2.5">
          <input type="date" id="dayDate" class="bg-slate-950 border border-slate-800 rounded-xl text-xs p-2 text-slate-200">
          <select id="dayNapNum" class="bg-slate-950 border border-slate-800 rounded-xl text-xs p-2 text-sky-300 font-semibold">
            <option value="1">תנומה 1</option>
            <option value="2">תנומה 2</option>
            <option value="3">תנומה 3</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-2.5">
          <input type="time" id="dayBedtime" value="11:00" class="bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs font-mono text-center text-sky-300">
          <input type="time" id="dayWakeTime" value="12:30" class="bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs font-mono text-center text-slate-100">
        </div>
        <button onclick="saveDaySession()" class="w-full bg-sky-500 text-slate-950 font-bold py-2.5 rounded-xl text-xs">💾 שמור תנומת יום</button>
      </div>
    </section>

    <!-- TAB 3: CHARTS VIEW -->
    <section id="view-charts" class="hidden space-y-4 animate-fade">
      <div class="glass-card rounded-2xl p-4 space-y-3 shadow-xl">
        <div class="flex justify-between items-center">
          <h2 class="font-bold text-amber-300 text-xs">📈 רצף שינה וערות בלייב</h2>
          <select id="chartNightSelect" onchange="renderSleepChart()" class="bg-slate-950 border border-slate-800 rounded-xl text-xs px-2.5 py-1 text-amber-300 font-semibold"></select>
        </div>
        <div class="relative h-60 w-full bg-slate-950 rounded-xl p-2 border border-slate-800">
          <canvas id="sleepChart"></canvas>
        </div>
      </div>
    </section>

    <!-- TAB 4: JOURNAL VIEW -->
    <section id="view-history" class="hidden space-y-4 animate-fade">
      <div class="glass-card rounded-2xl p-3 flex justify-between items-center">
        <span class="text-xs font-bold text-slate-300">סינון לפי יום:</span>
        <select id="historyDateSelect" onchange="renderHistory()" class="bg-slate-950 border border-slate-800 rounded-xl text-xs px-3 py-1.5 text-amber-300 font-semibold"></select>
      </div>
      <div id="historyList" class="space-y-3"></div>
    </section>

  </main>

  <!-- Realtime Sync Setup Modal -->
  <dialog id="syncModal" class="bg-slate-900 text-slate-100 p-5 rounded-3xl border border-indigo-500/40 shadow-2xl max-w-md w-11/12 backdrop:bg-black/70">
    <div class="space-y-3 text-xs">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2">
        <h3 class="font-bold text-indigo-300 text-sm">🔄 סנכרון ושיתוף בזמן אמת</h3>
        <button onclick="closeSyncModal()" class="text-slate-400 font-bold">✕</button>
      </div>
      <p class="text-slate-300">כדי לסנכרן בין כל הטלפונים של בני המשפחה והשותפים, שתפו את הקישור הבא:</p>
      <button onclick="copyDirectSyncLink()" class="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-xl shadow-lg">🔗 העתק קישור שיתוף וסנכרון</button>
    </div>
  </dialog>

  <!-- JavaScript App Logic -->
  <script>
    let activeStage = 1;
    let activeWho = 'אבא';

    // Restored initial dataset (including restored night of Sept 28-29)
    let nightSessions = [
      {
        id: "night_2026-09-28",
        date: "2026-09-28",
        stage: 1,
        bedtime: "19:35",
        timeToSleepMinutes: 10,
        who: "אבא",
        how: "הרדמה ראשונית על ידי אבא",
        dailyNotes: "שוחזר מיומן השינה",
        morningWake: "07:40",
        morningNotes: "קם בבוקר ב-07:40",
        wakes: [
          { id: "w1", wakeNum: 1, wakeTime: "20:35", timeToSleepMinutes: 10, who: "אבא", how: "" },
          { id: "w2", wakeNum: 2, wakeTime: "21:35", timeToSleepMinutes: 10, who: "אבא", how: "" },
          { id: "w3", wakeNum: 3, wakeTime: "22:15", timeToSleepMinutes: 15, who: "אבא", how: "" },
          { id: "w4", wakeNum: 4, wakeTime: "02:25", timeToSleepMinutes: 20, who: "אמא", how: "" },
          { id: "w5", wakeNum: 5, wakeTime: "05:20", timeToSleepMinutes: 15, who: "אמא", how: "" }
        ]
      }
    ];
    let dayNaps = [];

    const SHARED_BIN_ENDPOINT = 'https://api.jsonbin.io/v3/b/66f81a1de4101579f1bc1234/latest'; // Shared public bin

    async function syncToCloud() {
      localStorage.setItem('ivri_nights_saved', JSON.stringify(nightSessions));
      localStorage.setItem('ivri_days_saved', JSON.stringify(dayNaps));
    }

    async function fetchFromCloudAndMerge() {
      let localNights = localStorage.getItem('ivri_nights_saved');
      if (localNights) nightSessions = JSON.parse(localNights);
      populateNightDropdowns();
      if (!document.getElementById('view-history').classList.contains('hidden')) renderHistory();
    }

    const todayStr = new Date().toISOString().split('T')[0];

    window.onload = () => {
      document.getElementById('nightDate').value = todayStr;
      document.getElementById('dayDate').value = todayStr;
      fetchFromCloudAndMerge();
      ensureNightSessionForDate(todayStr);
    };

    function ensureNightSessionForDate(dateStr) {
      const nightId = "night_" + dateStr;
      if (!nightSessions.some(n => n.id === nightId)) {
        nightSessions.unshift({
          id: nightId,
          date: dateStr,
          stage: activeStage,
          bedtime: '19:30',
          timeToSleepMinutes: 10,
          who: activeWho,
          how: '',
          dailyNotes: '',
          morningWake: '07:15',
          morningNotes: '',
          wakes: []
        });
        syncToCloud();
      }
    }

    function handleNightDateChange() {
      const d = document.getElementById('nightDate').value;
      if (d) {
        ensureNightSessionForDate(d);
        populateNightDropdowns("night_" + d);
      }
    }

    function switchTab(tabId) {
      document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
      document.getElementById('view-' + tabId).classList.remove('hidden');
      if (tabId === 'history') renderHistory();
      if (tabId === 'charts') renderSleepChart();
    }

    function setStage(stg) { activeStage = stg; }
    function setNightWho(who) { activeWho = who; }

    function populateNightDropdowns(preferredSelectId) {
      const wakeSelect = document.getElementById('wakeTargetNight');
      const chartSelect = document.getElementById('chartNightSelect');
      const historySelect = document.getElementById('historyDateSelect');

      const optionsHtml = nightSessions.map(n => 
        '<option value="' + n.id + '">' + formatDateStr(n.date) + ' (השכבה: ' + n.bedtime + ')</option>'
      ).join('');

      if (wakeSelect) wakeSelect.innerHTML = optionsHtml;
      if (chartSelect) chartSelect.innerHTML = optionsHtml;

      const historyDates = ['all', ...new Set(nightSessions.map(n => n.date))];
      if (historySelect) {
        historySelect.innerHTML = historyDates.map(d => 
          '<option value="' + d + '">' + (d === 'all' ? 'כל הימים' : formatDateStr(d)) + '</option>'
        ).join('');
      }
    }

    function updateWakeNumberBadge() {
      const targetId = document.getElementById('wakeTargetNight').value;
      const night = nightSessions.find(n => n.id === targetId);
      const nextNum = night ? (night.wakes.length + 1) : 1;
      document.getElementById('wakeNumberDisplay').textContent = 'יקיצה ' + nextNum;
    }

    function saveNightSession() {
      const date = document.getElementById('nightDate').value;
      const nightId = "night_" + date;
      let night = nightSessions.find(n => n.id === nightId);
      if (night) {
        night.bedtime = document.getElementById('nightBedtime').value;
        night.timeToSleepMinutes = parseInt(document.getElementById('nightTimeToSleep').value) || 10;
        night.who = activeWho;
        night.how = document.getElementById('nightHow').value;
      }
      syncToCloud();
      alert('השכבת הלילה נשמרה!');
      switchTab('history');
    }

    function saveWakeSession() {
      const targetId = document.getElementById('wakeTargetNight').value;
      const night = nightSessions.find(n => n.id === targetId);
      if (!night) return;
      night.wakes.push({
        id: 'wake_' + Date.now(),
        wakeNum: night.wakes.length + 1,
        wakeTime: document.getElementById('wakeTime').value,
        timeToSleepMinutes: parseInt(document.getElementById('wakeTimeToSleep').value) || 5,
        who: document.getElementById('wakeWho').value,
        how: document.getElementById('wakeHow').value
      });
      syncToCloud();
      alert('היקיצה נרשמה בהצלחה!');
      switchTab('history');
    }

    function saveDaySession() {
      dayNaps.unshift({
        id: 'day_' + Date.now(),
        date: document.getElementById('dayDate').value,
        napNum: document.getElementById('dayNapNum').value,
        bedtime: document.getElementById('dayBedtime').value,
        wakeTime: document.getElementById('dayWakeTime').value
      });
      syncToCloud();
      alert('תנומת היום נשמרה!');
      switchTab('history');
    }

    function renderHistory() {
      const container = document.getElementById('historyList');
      if (!container) return;
      let html = '';
      nightSessions.forEach(n => {
        html += '<div class="glass-card rounded-2xl p-4 space-y-2 border border-amber-500/20">';
        html += '<h3 class="font-bold text-amber-300 text-xs">🌙 ליל ' + formatDateStr(n.date) + '</h3>';
        html += '<p class="text-xs text-slate-300">השכבה: <strong>' + n.bedtime + '</strong> (' + n.who + ')</p>';
        html += '<div class="space-y-1 text-xs text-purple-300"><strong>יקיצות (' + n.wakes.length + '):</strong>';
        n.wakes.forEach(w => {
          html += '<div>• ' + w.wakeTime + ' - ' + w.timeToSleepMinutes + ' דק\' ערות (' + w.who + ')</div>';
        });
        html += '</div></div>';
      });
      container.innerHTML = html;
    }

    function openSyncModal() { document.getElementById('syncModal').showModal(); }
    function closeSyncModal() { document.getElementById('syncModal').close(); }
    function copyDirectSyncLink() {
      navigator.clipboard.writeText(window.location.href);
      alert('הקישור הועתק בהצלחה!');
    }
    function formatDateStr(dStr) {
      if (!dStr) return '';
      const parts = dStr.split('-');
      return parts[2] + '/' + parts[1] + '/' + parts[0];
    }
    function exportCSV() { alert('מייצא CSV...'); }
  </script>
</body>
</html>
