<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>יומן שינה – עברי 👶</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style> body { font-family: 'Heebo', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col pb-12 selection:bg-amber-500 selection:text-slate-950">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50 shadow-lg">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2.5">
        <span class="text-2xl">👶</span>
        <div>
          <h1 class="text-lg font-extrabold text-amber-400">יומן שינה – עברי</h1>
          <p class="text-[11px] text-slate-400">תהליך ייעוץ שינה</p>
        </div>
      </div>
      <button onclick="exportCSV()" class="text-xs bg-amber-500/10 text-amber-400 border border-amber-500/30 px-2.5 py-1.5 rounded-xl hover:bg-amber-500/20 transition font-bold flex items-center gap-1">
        <span>📥</span> ייצוא CSV
      </button>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <nav class="bg-slate-900/80 border-b border-slate-800 max-w-md mx-auto w-full flex text-xs font-semibold">
    <button onclick="switchTab('night')" id="tab-night" class="flex-1 py-3 text-center text-amber-400 border-b-2 border-amber-400 font-bold transition">🌙 שנת לילה</button>
    <button onclick="switchTab('day')" id="tab-day" class="flex-1 py-3 text-center text-slate-400 border-b-2 border-transparent transition">☀️ תנומות יום</button>
    <button onclick="switchTab('charts')" id="tab-charts" class="flex-1 py-3 text-center text-slate-400 border-b-2 border-transparent transition">📈 גרף שינה</button>
    <button onclick="switchTab('history')" id="tab-history" class="flex-1 py-3 text-center text-slate-400 border-b-2 border-transparent transition">📜 יומן שינה</button>
  </nav>

  <!-- Main Content Area -->
  <main class="max-w-md mx-auto w-full p-4 flex-1 space-y-4">

    <!-- TAB 1: NIGHT VIEW -->
    <section id="view-night" class="space-y-4">
      
      <!-- Bedtime Form -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3.5 shadow-md">
        <div class="flex justify-between items-center">
          <h2 class="font-bold text-amber-400 text-base flex items-center gap-1.5">
            <span>🌙</span> השכבת לילה ראשונית
          </h2>
          <input type="date" id="nightDate" class="bg-slate-950 border border-slate-800 rounded-xl text-xs px-2.5 py-1.5 font-medium text-slate-200">
        </div>

        <!-- Stage Selection -->
        <div>
          <label class="text-[11px] text-slate-400 block mb-1">שלב בתהליך (הנחיית המטפלת)</label>
          <div class="grid grid-cols-5 gap-1.5" id="stageGroup">
            <button onclick="setStage(1)" id="stage-1" class="stage-btn bg-amber-500 text-slate-950 font-bold p-2 rounded-xl text-xs transition">שלב 1</button>
            <button onclick="setStage(2)" id="stage-2" class="stage-btn bg-slate-800 text-slate-300 font-semibold p-2 rounded-xl text-xs hover:bg-slate-700 transition">שלב 2</button>
            <button onclick="setStage(3)" id="stage-3" class="stage-btn bg-slate-800 text-slate-300 font-semibold p-2 rounded-xl text-xs hover:bg-slate-700 transition">שלב 3</button>
            <button onclick="setStage(4)" id="stage-4" class="stage-btn bg-slate-800 text-slate-300 font-semibold p-2 rounded-xl text-xs hover:bg-slate-700 transition">שלב 4</button>
            <button onclick="setStage(5)" id="stage-5" class="stage-btn bg-slate-800 text-slate-300 font-semibold p-2 rounded-xl text-xs hover:bg-slate-700 transition">שלב 5</button>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="text-[11px] text-slate-400 block mb-1">שעת השכבה</label>
            <input type="time" id="nightBedtime" value="19:30" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-center font-mono font-semibold text-amber-300">
          </div>
          <div>
            <label class="text-[11px] text-slate-400 block mb-1">כמה זמן עד שנרדם <span class="text-amber-400 font-bold">(בדקות)</span></label>
            <input type="number" id="nightTimeToSleep" placeholder="10" value="10" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-center font-mono text-slate-100">
          </div>
        </div>

        <!-- Who put to bed -->
        <div>
          <label class="text-[11px] text-slate-400 block mb-1.5">מי הרדים?</label>
          <div class="grid grid-cols-3 gap-2" id="nightWhoGroup">
            <button onclick="setNightWho('אבא')" id="who-אבא" class="who-btn bg-amber-500 text-slate-950 font-bold p-2.5 rounded-xl text-xs transition">אבא</button>
            <button onclick="setNightWho('אמא')" id="who-אמא" class="who-btn bg-slate-800 text-slate-300 font-semibold p-2.5 rounded-xl text-xs hover:bg-slate-700 transition">אמא</button>
            <button onclick="setNightWho('עצמאי')" id="who-עצמאי" class="who-btn bg-slate-800 text-slate-300 font-semibold p-2.5 rounded-xl text-xs hover:bg-slate-700 transition">עצמאי</button>
          </div>
        </div>

        <div>
          <label class="text-[11px] text-slate-400 block mb-1">איך נרדם / אופן הרדמה</label>
          <textarea id="nightHow" rows="2" placeholder="מוצץ, החזקת יד, ליטוף, שכיבה על הצד..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-100 focus:outline-none focus:border-amber-500 resize-none"></textarea>
        </div>

        <div>
          <label class="text-[11px] text-amber-400 font-medium block mb-1">📝 הערות מיוחדות על היום</label>
          <textarea id="nightDailyNotes" rows="2" placeholder="הרגיש לא טוב, חוסר שנת צהריים בגן, חיסון..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-100 focus:outline-none focus:border-amber-500 resize-none"></textarea>
        </div>

        <div>
          <label class="text-[11px] text-slate-400 block mb-1">שעת יקיצת בוקר סופית</label>
          <input type="time" id="morningWake" value="07:30" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-center font-mono font-semibold text-emerald-400">
        </div>

        <button onclick="saveNightSession()" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black py-3 rounded-xl text-sm shadow-lg shadow-amber-950/40 transition">💾 שמור השכבת לילה</button>
      </div>

      <!-- Night Awakenings Logger -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3.5 shadow-md">
        <div class="flex justify-between items-center">
          <h3 class="font-bold text-amber-300 text-sm flex items-center gap-1.5">
            <span>🔔</span> תיעוד יקיצת לילה (ללא הגבלה)
          </h3>
        </div>

        <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-xs flex justify-between items-center">
          <span class="text-slate-400">שיוך ליל הלילה:</span>
          <select id="wakeTargetNight" onchange="updateWakeNumberBadge()" class="bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-amber-300 text-xs font-semibold">
          </select>
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="text-[11px] text-slate-400 block mb-1">מספר יקיצה בלילה זה</label>
            <div id="wakeNumberDisplay" class="bg-slate-950 border border-slate-800 rounded-xl p-2 text-center text-xs font-bold text-amber-400 font-mono">
              יקיצה 1
            </div>
          </div>
          <div>
            <label class="text-[11px] text-slate-400 block mb-1">שעת יקיצה</label>
            <input type="time" id="wakeTime" value="20:30" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs font-mono font-semibold text-center text-slate-100">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="text-[11px] text-slate-400 block mb-1">זמן עד חזרה לשינה <span class="text-amber-400 font-bold">(בדקות)</span></label>
            <input type="number" id="wakeTimeToSleep" value="5" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-center text-slate-100">
          </div>
          <div>
            <label class="text-[11px] text-slate-400 block mb-1">מי טיפל?</label>
            <select id="wakeWho" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-slate-200">
              <option value="אבא">אבא</option>
              <option value="אמא">אמא</option>
              <option value="עצמאי">עצמאי</option>
            </select>
          </div>
        </div>

        <div>
          <label class="text-[11px] text-slate-400 block mb-1">איך נרדם בחזרה / הערות</label>
          <input type="text" id="wakeHow" placeholder="מוצץ, מגע, הנקה..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-slate-100">
        </div>

        <button onclick="saveWakeSession()" class="w-full bg-slate-800 hover:bg-slate-700 text-amber-300 font-bold py-2.5 rounded-xl text-xs border border-amber-500/20 transition">➕ הוסף יקיצה ללילה זה</button>
      </div>
    </section>

    <!-- TAB 2: DAY VIEW -->
    <section id="view-day" class="hidden space-y-4">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3.5 shadow-md">
        <div class="flex justify-between items-center">
          <h2 class="font-bold text-sky-400 text-base flex items-center gap-1.5">
            <span>☀️</span> תנומת יום
          </h2>
          <input type="date" id="dayDate" class="bg-slate-950 border border-slate-800 rounded-xl text-xs px-2.5 py-1.5 font-medium text-slate-200">
        </div>

        <div>
          <label class="text-[11px] text-slate-400 block mb-1">מספר תנומה ביום</label>
          <select id="dayNapNum" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs font-semibold text-sky-300">
            <option value="1">תנומה 1 (בוקר)</option>
            <option value="2">תנומה 2 (צהריים)</option>
            <option value="3">תנומה 3 (אחה"צ)</option>
            <option value="4">תנומה 4</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="text-[11px] text-slate-400 block mb-1">שעת השכבה</label>
            <input type="time" id="dayBedtime" value="11:00" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-center font-mono font-semibold text-sky-300">
          </div>
          <div>
            <label class="text-[11px] text-slate-400 block mb-1">זמן עד שנרדם <span class="text-sky-400 font-bold">(בדקות)</span></label>
            <input type="number" id="dayTimeToSleep" value="10" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-center text-slate-100">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="text-[11px] text-slate-400 block mb-1">שעת יקיצה</label>
            <input type="time" id="dayWakeTime" value="12:30" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-center font-mono text-slate-100">
          </div>
          <div>
            <label class="text-[11px] text-slate-400 block mb-1">מי הרדים?</label>
            <select id="dayWho" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200">
              <option value="גננת">גננת</option>
              <option value="אמא">אמא</option>
              <option value="אבא">אבא</option>
              <option value="עצמאי">עצמאי</option>
            </select>
          </div>
        </div>

        <div>
          <label class="text-[11px] text-slate-400 block mb-1">איך נרדם / הערות</label>
          <textarea id="dayHow" rows="2" placeholder="בעגלה / מנשא / בגן / במיטה..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-100 focus:outline-none focus:border-sky-500 resize-none"></textarea>
        </div>

        <button onclick="saveDaySession()" class="w-full bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 text-slate-950 font-black py-3 rounded-xl text-sm shadow-lg transition">💾 שמור תנומת יום</button>
      </div>
    </section>

    <!-- TAB 3: CHARTS VIEW -->
    <section id="view-charts" class="hidden space-y-4">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3.5">
        <div class="flex justify-between items-center">
          <h2 class="font-bold text-amber-400 text-sm">📈 גרף רצף שינה וערות בלייב</h2>
          <select id="chartNightSelect" onchange="renderSleepChart()" class="bg-slate-950 border border-slate-800 rounded-xl text-xs px-2.5 py-1 text-amber-300 font-semibold"></select>
        </div>

        <p class="text-[11px] text-slate-400">ציר עליון: <strong>ער (1)</strong> | ציר תחתון: <strong>ישן (0)</strong> לאורך הלילה:</p>

        <div class="relative h-64 w-full bg-slate-950 rounded-xl p-2 border border-slate-800">
          <canvas id="sleepChart"></canvas>
        </div>

        <div id="chartStatsSummary" class="grid grid-cols-3 gap-2 pt-2 text-center text-xs"></div>
      </div>
    </section>

    <!-- TAB 4: JOURNAL VIEW -->
    <section id="view-history" class="hidden space-y-4">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 flex justify-between items-center">
        <span class="text-xs font-bold text-slate-300">בחר יום להצגה:</span>
        <select id="historyDateSelect" onchange="renderHistory()" class="bg-slate-950 border border-slate-800 rounded-xl text-xs px-3 py-1.5 font-semibold text-amber-400"></select>
      </div>

      <div id="historyList" class="space-y-3"></div>
    </section>

  </main>

    <!-- JavaScript App Logic -->
  <script>
    let activeStage = 1;
    let activeWho = 'אבא';

    // Baseline dataset pre-loaded for 28.09.26
    const INITIAL_NIGHTS = [
      {
        id: "night_2026-09-28",
        date: '2026-09-28',
        stage: 1,
        bedtime: '19:35',
        timeToSleepMinutes: 10,
        who: 'אבא',
        how: 'עשר דקות שהוא החזיק לי את היד, יותר מאשר שאני ליטפתי אותו הוא תפס אותי, שכיבה על הצד',
        dailyNotes: 'יומן לילה ראשון בתהליך - הרגיש רגוע',
        morningWake: '07:40',
        wakes: [
          { wakeNum: 1, wakeTime: '20:35', timeToSleepMinutes: 1, who: 'אבא', how: 'מוצץ, ונתתי לו יד' },
          { wakeNum: 2, wakeTime: '21:35', timeToSleepMinutes: 1, who: 'אבא', how: 'מוצץ, ונתתי לו יד' },
          { wakeNum: 3, wakeTime: '22:15', timeToSleepMinutes: 45, who: 'אמא', how: 'השכבה ומגע. קיבל תוך כדי הנקה, כי נראה שכאבה לו הבטן, ושלשל תוך כדי.' },
          { wakeNum: 4, wakeTime: '02:25', timeToSleepMinutes: 5, who: 'אבא', how: 'מוצץ ומגע' },
          { wakeNum: 5, wakeTime: '05:20', timeToSleepMinutes: 15, who: 'אבא', how: 'מוצץ ומגע' }
        ]
      }
    ];

    const INITIAL_DAY_NAPS = [];

    let nightSessions = JSON.parse(localStorage.getItem('ivri_night_sessions_v4')) || INITIAL_NIGHTS;
    let dayNaps = JSON.parse(localStorage.getItem('ivri_day_naps_v4')) || INITIAL_DAY_NAPS;

    document.getElementById('nightDate').valueAsDate = new Date();
    document.getElementById('dayDate').valueAsDate = new Date();

    window.onload = () => {
      populateNightDropdowns();
      updateWakeNumberBadge();
    };

    function switchTab(tabId) {
      document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
      document.querySelectorAll('nav > button').forEach(b => {
        b.classList.remove('text-amber-400', 'border-amber-400', 'font-bold');
        b.classList.add('text-slate-400', 'border-transparent');
      });

      document.getElementById(`view-${tabId}`).classList.remove('hidden');
      const activeBtn = document.getElementById(`tab-${tabId}`);
      if (activeBtn) {
        activeBtn.classList.add('text-amber-400', 'border-amber-400', 'font-bold');
        activeBtn.classList.remove('text-slate-400', 'border-transparent');
      }

      if (tabId === 'history') renderHistory();
      if (tabId === 'charts') renderSleepChart();
    }

    function setStage(stg) {
      activeStage = stg;
      document.querySelectorAll('.stage-btn').forEach(b => {
        b.classList.remove('bg-amber-500', 'text-slate-950', 'font-bold');
        b.classList.add('bg-slate-800', 'text-slate-300', 'font-semibold');
      });
      const selected = document.getElementById(`stage-${stg}`);
      if (selected) {
        selected.classList.add('bg-amber-500', 'text-slate-950', 'font-bold');
        selected.classList.remove('bg-slate-800', 'text-slate-300');
      }
    }

    function setNightWho(who) {
      activeWho = who;
      document.querySelectorAll('.who-btn').forEach(b => {
        b.classList.remove('bg-amber-500', 'text-slate-950', 'font-bold');
        b.classList.add('bg-slate-800', 'text-slate-300', 'font-semibold');
      });
      const selected = document.getElementById(`who-${who}`);
      if (selected) {
        selected.classList.add('bg-amber-500', 'text-slate-950', 'font-bold');
        selected.classList.remove('bg-slate-800', 'text-slate-300');
      }
    }

    function populateNightDropdowns(preferredSelectId) {
      const wakeSelect = document.getElementById('wakeTargetNight');
      const chartSelect = document.getElementById('chartNightSelect');
      const historySelect = document.getElementById('historyDateSelect');

      const optionsHtml = nightSessions.map(n => 
        `<option value="${n.id}">${formatDateStr(n.date)} (השכבה ב-${n.bedtime})</option>`
      ).join('');

      wakeSelect.innerHTML = optionsHtml;
      chartSelect.innerHTML = optionsHtml;

      if (preferredSelectId && nightSessions.some(n => n.id === preferredSelectId)) {
        wakeSelect.value = preferredSelectId;
        chartSelect.value = preferredSelectId;
      }

      const historyDates = ['all', ...new Set([...nightSessions.map(n => n.date), ...dayNaps.map(d => d.date)])];
      historySelect.innerHTML = historyDates.map(d => 
        `<option value="${d}">${d === 'all' ? 'כל הימים (הכל)' : formatDateStr(d)}</option>`
      ).join('');

      updateWakeNumberBadge();
    }

    function updateWakeNumberBadge() {
      const targetId = document.getElementById('wakeTargetNight').value;
      const night = nightSessions.find(n => n.id === targetId);
      const nextNum = night ? (night.wakes.length + 1) : 1;
      document.getElementById('wakeNumberDisplay').textContent = `יקיצה ${nextNum}`;
    }

    function saveNightSession() {
      const date = document.getElementById('nightDate').value;
      const bedtime = document.getElementById('nightBedtime').value;
      const timeToSleepMinutes = parseInt(document.getElementById('nightTimeToSleep').value) || 10;
      const how = document.getElementById('nightHow').value;
      const dailyNotes = document.getElementById('nightDailyNotes').value;
      const morningWake = document.getElementById('morningWake').value || '07:30';

      const nightId = "night_" + date;
      const existingIdx = nightSessions.findIndex(n => n.id === nightId);

      const newNight = {
        id: nightId,
        date,
        stage: activeStage,
        bedtime,
        timeToSleepMinutes,
        who: activeWho,
        how,
        dailyNotes,
        morningWake,
        wakes: existingIdx !== -1 ? nightSessions[existingIdx].wakes : []
      };

      if (existingIdx !== -1) {
        nightSessions[existingIdx] = newNight;
      } else {
        nightSessions.unshift(newNight);
      }

      saveData();
      populateNightDropdowns(nightId); // Automatically select the newly created night!
      alert(`השכבת הלילה ל-${formatDateStr(date)} נשמרה בהצלחה! כעת תיעוד היקיצות מחובר ללילה זה.`);
      switchTab('history');
    }

    function saveWakeSession() {
      const targetId = document.getElementById('wakeTargetNight').value;
      const night = nightSessions.find(n => n.id === targetId);

      if (!night) {
        alert('אנא צור השכבת לילה ראשונית לפני הוספת יקיצות.');
        return;
      }

      const wakeTime = document.getElementById('wakeTime').value;
      const timeToSleepMinutes = parseInt(document.getElementById('wakeTimeToSleep').value) || 5;
      const who = document.getElementById('wakeWho').value;
      const how = document.getElementById('wakeHow').value;

      const wakeEntry = {
        wakeNum: night.wakes.length + 1,
        wakeTime,
        timeToSleepMinutes,
        who,
        how
      };

      night.wakes.push(wakeEntry);
      saveData();
      updateWakeNumberBadge();
      alert(`יקיצה ${wakeEntry.wakeNum} נוספה בהצלחה לליל ה-${formatDateStr(night.date)}!`);
      switchTab('history');
    }

    function saveDaySession() {
      const date = document.getElementById('dayDate').value;
      const napNum = document.getElementById('dayNapNum').value;
      const bedtime = document.getElementById('dayBedtime').value;
      const timeToSleepMinutes = parseInt(document.getElementById('dayTimeToSleep').value) || 10;
      const wakeTime = document.getElementById('dayWakeTime').value;
      const who = document.getElementById('dayWho').value;
      const how = document.getElementById('dayHow').value;

      const napEntry = {
        id: Date.now(),
        date,
        napNum,
        bedtime,
        timeToSleepMinutes,
        wakeTime,
        who,
        how
      };

      dayNaps.unshift(napEntry);
      saveData();
      populateNightDropdowns();
      alert('תנומת היום נשמרה בהצלחה!');
      switchTab('history');
    }

    function saveData() {
      localStorage.setItem('ivri_night_sessions_v4', JSON.stringify(nightSessions));
      localStorage.setItem('ivri_day_naps_v4', JSON.stringify(dayNaps));
    }

    function renderHistory() {
      const container = document.getElementById('historyList');
      const selectedDate = document.getElementById('historyDateSelect').value;

      let filteredNights = nightSessions;
      let filteredNaps = dayNaps;

      if (selectedDate !== 'all') {
        filteredNights = nightSessions.filter(n => n.date === selectedDate);
        filteredNaps = dayNaps.filter(d => d.date === selectedDate);
      }

      if (filteredNights.length === 0 && filteredNaps.length === 0) {
        container.innerHTML = `
          <div class="text-center py-10 text-slate-500 bg-slate-900 rounded-2xl border border-slate-800">
            <span class="text-3xl block mb-2">📋</span>
            <p class="text-xs">אין תיעוד במאגר עבור תאריך זה.</p>
          </div>
        `;
        return;
      }

      let html = '';

      filteredNights.forEach(n => {
        let totalAwakeMinutes = n.timeToSleepMinutes;
        n.wakes.forEach(w => totalAwakeMinutes += (w.timeToSleepMinutes || 0));

        html += `
          <div class="bg-slate-900 border border-amber-500/30 rounded-2xl p-4 space-y-3 shadow-md">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
              <div>
                <h3 class="font-bold text-amber-400 text-sm">🌙 ליל ${formatDateStr(n.date)} (שלב ${n.stage})</h3>
                <p class="text-[11px] text-slate-400">השכבה: <span class="font-mono text-slate-200">${n.bedtime}</span> | הרדים: <strong>${n.who}</strong></p>
              </div>
              <div class="text-left text-[11px] font-mono text-amber-300">
                ${n.wakes.length} יקיצות<br>
                ${totalAwakeMinutes} דק' ערות
              </div>
            </div>

            <div class="text-xs text-slate-300 space-y-1">
              <p>⏱️ <strong>זמן להרדמה:</strong> ${n.timeToSleepMinutes} דקות</p>
              ${n.how ? `<p class="italic text-slate-400 bg-slate-950 p-2 rounded-lg">💬 "${n.how}"</p>` : ''}
              ${n.dailyNotes ? `<p class="text-amber-300 bg-amber-500/10 p-2 rounded-lg">📝 <strong>הערות יום:</strong> "${n.dailyNotes}"</p>` : ''}
              <p>☀️ <strong>יקיצת בוקר:</strong> ${n.morningWake || '07:30'}</p>
            </div>

            <div class="space-y-2 pt-2 border-t border-slate-800">
              <h4 class="text-xs font-bold text-amber-300">🔔 פירוט יקיצות בלילה:</h4>
              ${n.wakes.length === 0 ? '<p class="text-[11px] text-slate-500 italic">ללא יקיצות רשומות</p>' : ''}
              ${n.wakes.map(w => `
                <div class="bg-slate-950 border border-slate-800/80 rounded-xl p-2.5 text-xs space-y-1">
                  <div class="flex justify-between font-bold text-amber-400">
                    <span>יקיצה ${w.wakeNum} •${w.wakeTime}</span>
                    <span>${w.timeToSleepMinutes} דקות ערות</span>
                  </div>
                  <div class="text-slate-300">טיפל: <strong>${w.who}</strong></div>${w.how ? `<div class="text-[11px] text-slate-400 italic">💬 "${w.how}"</div>` : ''}
                </div>
              `).join('')}
            </div>
          </div>
        `;
      });

      filteredNaps.forEach(d => {
        html += `
          <div class="bg-slate-900 border border-sky-500/30 rounded-2xl p-4 space-y-2 shadow-md">
            <div class="flex justify-between items-center">
              <h3 class="font-bold text-sky-400 text-sm">☀️ תנומת יום ${d.napNum} (${formatDateStr(d.date)})</h3>
              <span class="text-xs font-mono text-slate-400">${d.bedtime} - ${d.wakeTime || '?'}</span>
            </div>
            <div class="text-xs text-slate-300">הרדימה/טיפלה: <strong>${d.who}</strong> | זמן להרדמה: ${d.timeToSleepMinutes} דקות</div>
            ${d.how ? `<p class="text-[11px] text-slate-400 italic bg-slate-950 p-2 rounded-lg">💬 "${d.how}"</p>` : ''}
          </div>
        `;
      });

      container.innerHTML = html;
    }

    let chartInstance = null;
    function renderSleepChart() {
      const targetId = document.getElementById('chartNightSelect').value;
      const night = nightSessions.find(n => n.id === targetId);
      const ctx = document.getElementById('sleepChart').getContext('2d');

      if (!night) return;

      if (chartInstance) chartInstance.destroy();

      const labels = [];
      const dataPoints = [];

      labels.push(night.bedtime);
      dataPoints.push(1);

      const fallAsleepTime = addMinutesToTime(night.bedtime, night.timeToSleepMinutes);
      labels.push(fallAsleepTime);
      dataPoints.push(0);

      let totalWakeMinutes = night.timeToSleepMinutes;

      night.wakes.forEach(w => {
        labels.push(w.wakeTime);
        dataPoints.push(1);

        const backToSleepTime = addMinutesToTime(w.wakeTime, w.timeToSleepMinutes);
        labels.push(backToSleepTime);
        dataPoints.push(0);

        totalWakeMinutes += w.timeToSleepMinutes;
      });

      const morningTime = night.morningWake || '07:30';
      labels.push(morningTime);
      dataPoints.push(1);

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'מצב שינה / ערות',
            data: dataPoints,
            stepped: true,
            borderColor: '#f59e0b',
            backgroundColor: 'rgba(245, 158, 11, 0.15)',
            borderWidth: 3,
            fill: true,
            pointBackgroundColor: '#f59e0b',
            pointRadius: 5
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: {
              min: -0.2,
              max: 1.2,
              ticks: {
                stepSize: 1,
                color: '#cbd5e1',
                callback: function(val) {
                  if (val === 1) return 'ער 🔔';
                  if (val === 0) return 'ישן 😴';
                  return '';
                }
              },
              grid: { color: '#334155' }
            },
            x: {
              ticks: { color: '#cbd5e1' },
              grid: { color: '#1e293b' }
            }
          },
          plugins: {
            legend: { display: false }
          }
        }
      });

      document.getElementById('chartStatsSummary').innerHTML = `
        <div class="bg-slate-950 p-2 rounded-xl border border-slate-800">
          <span class="text-slate-400 block text-[10px]">שעת השכבה</span>
          <span class="font-bold text-amber-400 font-mono">${night.bedtime}</span>
        </div>
        <div class="bg-slate-950 p-2 rounded-xl border border-slate-800">
          <span class="text-slate-400 block text-[10px]">מספר יקיצות</span>
          <span class="font-bold text-amber-400 font-mono">${night.wakes.length}</span>
        </div>
        <div class="bg-slate-950 p-2 rounded-xl border border-slate-800">
          <span class="text-slate-400 block text-[10px]">סה"כ ערות</span>
          <span class="font-bold text-amber-400 font-mono">${totalWakeMinutes} דק'</span>
        </div>
      `;
    }

    function addMinutesToTime(timeStr, mins) {
      if (!timeStr) return '00:00';
      const parts = timeStr.split(':');
      let h = parseInt(parts[0]);
      let m = parseInt(parts[1]) + mins;
      h = (h + Math.floor(m / 60)) % 24;
      m = m % 60;
      return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
    }

    function formatDateStr(dStr) {
      if (!dStr) return '';
      const parts = dStr.split('-');
      return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    // Robust CSV Exporter compatible with iOS Safari Blob URLs
    function exportCSV() {
      try {
        let csv = "\uFEFFתאריך,סוג אירוע,שלב,שעה,מי הרדים/טיפל,זמן להרדמה (בדקות),הערות\n";
        
        nightSessions.forEach(n => {
          const notesClean = (n.how || '').replace(/"/g, '""') + ' | ' + (n.dailyNotes || '').replace(/"/g, '""');
          csv += `"${n.date}","השכבת לילה","${n.stage || ''}","${n.bedtime || ''}","${n.who || ''}","${n.timeToSleepMinutes || ''}","${notesClean}"\n`;
          (n.wakes || []).forEach(w => {
            csv += `"${n.date}","יקיצה ${w.wakeNum}","${n.stage || ''}","${w.wakeTime || ''}","${w.who || ''}","${w.timeToSleepMinutes || ''}","${(w.how || '').replace(/"/g, '""')}"\n`;
          });
        });

        dayNaps.forEach(d => {
          csv += `"${d.date}","תנומת יום ${d.napNum}","","${d.bedtime || ''}","${d.who || ''}","${d.timeToSleepMinutes || ''}","${(d.how || '').replace(/"/g, '""')}"\n`;
        });

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.setAttribute("download", `ivri_sleep_journal_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => URL.revokeObjectURL(url), 500);
      } catch (e) {
        alert('שגיאה בייצוא קובץ: ' + e.message);
      }
    }
  </script>
</body>
</html>
