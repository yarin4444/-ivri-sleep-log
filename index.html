<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>יומן שינה עברי 👶</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Heebo', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col pb-12 selection:bg-amber-500 selection:text-slate-950">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50 shadow-lg">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2.5">
        <span class="text-2xl">👶</span>
        <div>
          <h1 class="text-lg font-extrabold text-amber-400">יומן שינה – עברי</h1>
          <div class="flex items-center gap-1.5 text-[11px] text-emerald-400">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span>סנכרון ענן פעיל (חדר: <strong id="roomDisplay">HAUSLER_2026</strong>)</span>
          </div>
        </div>
      </div>
      <button onclick="toggleRoomModal()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1.5 rounded-lg border border-slate-700 transition">🗝️ חדר</button>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <nav class="bg-slate-900/80 border-b border-slate-800 max-w-md mx-auto w-full flex text-xs font-semibold">
    <button onclick="switchTab('night')" id="tab-night" class="flex-1 py-3 text-center text-amber-400 border-b-2 border-amber-400 font-bold transition">🌙 שנת לילה</button>
    <button onclick="switchTab('day')" id="tab-day" class="flex-1 py-3 text-center text-slate-400 border-b-2 border-transparent transition">☀️ תנומות יום</button>
    <button onclick="switchTab('history')" id="tab-history" class="flex-1 py-3 text-center text-slate-400 border-b-2 border-transparent transition">📜 היסטוריה (<span id="logCount">0</span>)</button>
  </nav>

  <!-- Main Content -->
  <main class="max-w-md mx-auto w-full p-4 flex-1 space-y-4">

    <!-- NIGHT VIEW -->
    <section id="view-night" class="space-y-4">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3.5 shadow-md">
        <div class="flex justify-between items-center">
          <h2 class="font-bold text-amber-400 text-base flex items-center gap-1.5">
            <span>🌙</span> השכבת לילה ראשונית
          </h2>
          <input type="date" id="nightDate" class="bg-slate-950 border border-slate-800 rounded-xl text-xs px-2.5 py-1.5 font-medium text-slate-200">
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="text-[11px] text-slate-400 block mb-1">שעת השכבה</label>
            <input type="time" id="nightBedtime" value="19:30" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-center font-mono font-semibold text-amber-300">
          </div>
          <div>
            <label class="text-[11px] text-slate-400 block mb-1">כמה זמן עד שנרדם</label>
            <input type="text" id="nightTimeToSleep" placeholder="למשל: 10 דקות" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-center text-slate-100">
          </div>
        </div>

        <div>
          <label class="text-[11px] text-slate-400 block mb-1.5">מי הרדים?</label>
          <div class="grid grid-cols-3 gap-2" id="nightWhoSelector">
            <button onclick="setNightWho('ירין')" id="who-ירין" class="who-btn bg-amber-500 text-slate-950 font-bold p-2 rounded-xl text-xs transition">ירין</button>
            <button onclick="setNightWho('שני')" id="who-שני" class="who-btn bg-slate-800 text-slate-300 font-semibold p-2 rounded-xl text-xs hover:bg-slate-700 transition">שני</button>
            <button onclick="setNightWho('מטפלת')" id="who-מטפלת" class="who-btn bg-slate-800 text-slate-300 font-semibold p-2 rounded-xl text-xs hover:bg-slate-700 transition">מטפלת</button>
          </div>
        </div>

        <div>
          <label class="text-[11px] text-slate-400 block mb-1">איך נרדם / אופן הרדמה</label>
          <textarea id="nightHow" rows="2" placeholder="מוצץ, החזקת יד, ליטוף, שכיבה על הצד..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-100 focus:outline-none focus:border-amber-500 resize-none"></textarea>
        </div>

        <button onclick="saveNightSession()" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black py-3 rounded-xl text-sm shadow-lg shadow-amber-950/40 transition">💾 שמור השכבת לילה בענן</button>
      </div>

      <!-- Night Awakenings Logger -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3.5 shadow-md">
        <h3 class="font-bold text-amber-300 text-sm flex items-center gap-1.5">
          <span>🔔</span> תיעוד יקיצת לילה
        </h3>
        
        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="text-[11px] text-slate-400 block mb-1">מספר יקיצה</label>
            <select id="wakeNumber" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs font-semibold text-amber-300">
              <option value="1">יקיצה 1</option>
              <option value="2">יקיצה 2</option>
              <option value="3">יקיצה 3</option>
              <option value="4">יקיצה 4</option>
              <option value="5">יקיצה 5</option>
            </select>
          </div>
          <div>
            <label class="text-[11px] text-slate-400 block mb-1">שעת יקיצה</label>
            <input type="time" id="wakeTime" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs font-mono font-semibold text-center text-slate-100">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="text-[11px] text-slate-400 block mb-1">כמה זמן עד שנרדם</label>
            <input type="text" id="wakeTimeToSleep" placeholder="כמה דקות?" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-center text-slate-100">
          </div>
          <div>
            <label class="text-[11px] text-slate-400 block mb-1">מי טיפל?</label>
            <select id="wakeWho" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-slate-200">
              <option value="ירין">ירין</option>
              <option value="שני">שני</option>
              <option value="מטפלת">מטפלת</option>
            </select>
          </div>
        </div>

        <div>
          <label class="text-[11px] text-slate-400 block mb-1">איך נרדם בחזרה</label>
          <input type="text" id="wakeHow" placeholder="מוצץ, מלטף, יד..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-slate-100">
        </div>

        <button onclick="saveWakeSession()" class="w-full bg-slate-800 hover:bg-slate-700 text-amber-300 font-bold py-2.5 rounded-xl text-xs border border-amber-500/20 transition">➕ שמור יקיצה בענן</button>
      </div>
    </section>

    <!-- DAY VIEW -->
    <section id="view-day" class="hidden space-y-4">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3.5 shadow-md">
        <div class="flex justify-between items-center">
          <h2 class="font-bold text-sky-400 text-base flex items-center gap-1.5">
            <span>☀️</span> תנומת יום
          </h2>
          <input type="date" id="dayDate" class="bg-slate-950 border border-slate-800 rounded-xl text-xs px-2.5 py-1.5 font-medium text-slate-200">
        </div>

        <div>
          <label class="text-[11px] text-slate-400 block mb-1">מספר תנומה ביום</label>
          <select id="dayNapNum" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs font-semibold text-sky-300">
            <option value="1">תנומה 1 (בוקר)</option>
            <option value="2">תנומה 2 (צהריים)</option>
            <option value="3">תנומה 3 (אחה"צ)</option>
            <option value="4">תנומה 4</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="text-[11px] text-slate-400 block mb-1">שעת השכבה</label>
            <input type="time" id="dayBedtime" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-center font-mono font-semibold text-sky-300">
          </div>
          <div>
            <label class="text-[11px] text-slate-400 block mb-1">זמן עד שנרדם</label>
            <input type="text" id="dayTimeToSleep" placeholder="כמה דקות?" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-center text-slate-100">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="text-[11px] text-slate-400 block mb-1">שעת יקיצה</label>
            <input type="time" id="dayWakeTime" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-center font-mono text-slate-100">
          </div>
          <div>
            <label class="text-[11px] text-slate-400 block mb-1">מי הרדים?</label>
            <select id="dayWho" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200">
              <option value="שני">שני</option>
              <option value="ירין">ירין</option>
              <option value="מטפלת">מטפלת</option>
            </select>
          </div>
        </div>

        <div>
          <label class="text-[11px] text-slate-400 block mb-1">איך נרדם / הערות</label>
          <textarea id="dayHow" rows="2" placeholder="בעגלה / מנשא / במיטה..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-100 focus:outline-none focus:border-sky-500 resize-none"></textarea>
        </div>

        <button onclick="saveDaySession()" class="w-full bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-slate-950 font-black py-3 rounded-xl text-sm shadow-lg transition">💾 שמור תנומת יום בענן</button>
      </div>
    </section>

    <!-- HISTORY & EXPORT -->
    <section id="view-history" class="hidden space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="font-bold text-slate-200 text-sm">יומן אירועים מסונכרן</h2>
        <button onclick="exportCSV()" class="text-xs bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-bold px-3 py-1.5 rounded-xl hover:bg-emerald-500/30 transition">📥 הורד קובץ ליועצת (CSV)</button>
      </div>

      <div id="historyList" class="space-y-3">
        <!-- Dynamic History Cards -->
      </div>
    </section>

  </main>

  <script>
    let activeWho = 'ירין';
    let roomCode = localStorage.getItem('ivri_room_code') || 'HAUSLER_2026';
    let sleepLogs = JSON.parse(localStorage.getItem('ivri_logs_' + roomCode) || '[]');

    document.getElementById('nightDate').valueAsDate = new Date();
    document.getElementById('dayDate').valueAsDate = new Date();
    document.getElementById('roomDisplay').textContent = roomCode;

    function switchTab(tabId) {
      document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
      document.querySelectorAll('nav > button').forEach(b => {
        b.classList.remove('text-amber-400', 'border-amber-400', 'font-bold');
        b.classList.add('text-slate-400', 'border-transparent');
      });

      document.getElementById(`view-${tabId}`).classList.remove('hidden');
      const activeBtn = document.getElementById(`tab-${tabId}`);
      activeBtn.classList.add('text-amber-400', 'border-amber-400', 'font-bold');
      activeBtn.classList.remove('text-slate-400', 'border-transparent');

      if (tabId === 'history') renderHistory();
    }

    function setNightWho(who) {
      activeWho = who;
      document.querySelectorAll('.who-btn').forEach(b => {
        b.classList.remove('bg-amber-500', 'text-slate-950', 'font-bold');
        b.classList.add('bg-slate-800', 'text-slate-300', 'font-semibold');
      });
      const selected = document.getElementById(`who-${who}`);
      if (selected) {
        selected.classList.add('bg-amber-500', 'text-slate-950', 'font-bold');
        selected.classList.remove('bg-slate-800', 'text-slate-300');
      }
    }

    function saveNightSession() {
      const entry = {
        id: Date.now(),
        type: 'night_bedtime',
        date: document.getElementById('nightDate').value,
        time: document.getElementById('nightBedtime').value,
        timeToSleep: document.getElementById('nightTimeToSleep').value || '10 דקות',
        who: activeWho,
        how: document.getElementById('nightHow').value,
        timestamp: new Date().toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' })
      };

      sleepLogs.unshift(entry);
      saveLogs();
      alert('השכבת הלילה נשמרה בהצלחה!');
      switchTab('history');
    }

    function saveWakeSession() {
      const entry = {
        id: Date.now(),
        type: 'night_wake',
        date: document.getElementById('nightDate').value,
        wakeNum: document.getElementById('wakeNumber').value,
        time: document.getElementById('wakeTime').value,
        timeToSleep: document.getElementById('wakeTimeToSleep').value,
        who: document.getElementById('wakeWho').value,
        how: document.getElementById('wakeHow').value,
        timestamp: new Date().toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' })
      };

      sleepLogs.unshift(entry);
      saveLogs();
      alert('יקיצת הלילה תועדה בהצלחה!');
      switchTab('history');
    }

    function saveDaySession() {
      const entry = {
        id: Date.now(),
        type: 'day_nap',
        date: document.getElementById('dayDate').value,
        napNum: document.getElementById('dayNapNum').value,
        time: document.getElementById('dayBedtime').value,
        timeToSleep: document.getElementById('dayTimeToSleep').value,
        wakeTime: document.getElementById('dayWakeTime').value,
        who: document.getElementById('dayWho').value,
        how: document.getElementById('dayHow').value,
        timestamp: new Date().toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' })
      };

      sleepLogs.unshift(entry);
      saveLogs();
      alert('תנומת היום נשמרה בהצלחה!');
      switchTab('history');
    }

    function saveLogs() {
      localStorage.setItem('ivri_logs_' + roomCode, JSON.stringify(sleepLogs));
      document.getElementById('logCount').textContent = sleepLogs.length;
    }

    function renderHistory() {
      const container = document.getElementById('historyList');
      document.getElementById('logCount').textContent = sleepLogs.length;

      if (sleepLogs.length === 0) {
        container.innerHTML = `
          <div class="text-center py-10 text-slate-500 bg-slate-900 rounded-2xl border border-slate-800">
            <span class="text-3xl block mb-2">📋</span>
            <p class="text-xs">עדיין לא נרשמו אירועי שינה בחדר זה.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = sleepLogs.map(item => {
        if (item.type === 'night_bedtime') {
          return `
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 space-y-1.5 shadow-sm">
              <div class="flex justify-between items-center text-xs">
                <span class="font-bold text-amber-400">🌙 השכבת לילה</span>
                <span class="text-slate-400 font-mono">${item.date} • ${item.time}</span>
              </div>
              <div class="text-xs text-slate-300">הרדים: <strong>${item.who}</strong> | זמן להרדמה: ${item.timeToSleep}</div>
              ${item.how ? `<p class="text-[11px] text-slate-400 italic">💬 "${item.how}"</p>` : ''}
            </div>
          `;
        } else if (item.type === 'night_wake') {
          return `
            <div class="bg-slate-900 border border-slate-800/80 rounded-2xl p-3.5 space-y-1.5 shadow-sm">
              <div class="flex justify-between items-center text-xs">
                <span class="font-bold text-amber-300">🔔 יקיצה ${item.wakeNum}</span>
                <span class="text-slate-400 font-mono">${item.date} • ${item.time}</span>
              </div>
              <div class="text-xs text-slate-300">טיפל: <strong>${item.who}</strong> | זמן חזרה לשינה: ${item.timeToSleep}</div>
              ${item.how ? `<p class="text-[11px] text-slate-400 italic">💬 "${item.how}"</p>` : ''}
            </div>
          `;
        } else {
          return `
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 space-y-1.5 shadow-sm">
              <div class="flex justify-between items-center text-xs">
                <span class="font-bold text-sky-400">☀️ תנומה ${item.napNum}</span>
                <span class="text-slate-400 font-mono">${item.date} • ${item.time} - ${item.wakeTime || '?'}</span>
              </div>
              <div class="text-xs text-slate-300">הרדים: <strong>${item.who}</strong> | זמן להרדמה: ${item.timeToSleep}</div>
              ${item.how ? `<p class="text-[11px] text-slate-400 italic">💬 "${item.how}"</p>` : ''}
            </div>
          `;
        }
      }).join('');
    }

    function exportCSV() {
      let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
      csvContent += "תאריך,סוג אירוע,שעה,מי הרדים/טיפל,זמן להרדמה,הערות\n";

      sleepLogs.forEach(l => {
        const typeName = l.type === 'night_bedtime' ? 'השכבת לילה' : (l.type === 'night_wake' ? `יקיצה ${l.wakeNum}` : `תנומת יום ${l.napNum}`);
        csvContent += `"${l.date}","${typeName}","${l.time || ''}","${l.who || ''}","${l.timeToSleep || ''}","${l.how || ''}"\n`;
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `יומן_שינה_עברי_${roomCode}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function toggleRoomModal() {
      const newCode = prompt('הזן קוד חדר משותף (אותיות באנגלית או מספרים):', roomCode);
      if (newCode && newCode.trim() !== '') {
        roomCode = newCode.trim().toUpperCase();
        localStorage.setItem('ivri_room_code', roomCode);
        location.reload();
      }
    }
  </script>
</body>
</html>
